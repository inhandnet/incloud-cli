name: Edge

# Rolling "edge" channel: every merge to main publishes a linux-amd64 build to
# the S3 mirror, so dev / test environments can track the latest CLI without a
# release. Consumers: https://incloud-cli-releases.s3.cn-north-1.amazonaws.com.cn/inhandnet/incloud-cli/edge/
# Tagged releases (release.yml) remain the only channel for production.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: edge
  cancel-in-progress: true

env:
  GOPROXY: https://goproxy.cn,direct
  GONOSUMDB: "*"

jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git describe needs tag history

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - run: CGO_ENABLED=0 go test ./... -count=1

      - name: Build linux-amd64
        run: |
          VERSION=$(git describe --tags --always)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          make build-all PLATFORMS=linux/amd64 VERSION="${VERSION}" COMMIT=${{ github.sha }}

      - name: Checksums and channel metadata
        run: |
          cd bin
          sha256sum incloud-* > checksums.txt
          cat > edge.yaml <<EOF
          version: ${VERSION}
          commit: ${{ github.sha }}
          built_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          cat edge.yaml checksums.txt

      - name: Upload to S3 edge channel
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_CN_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_CN_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: cn-north-1
        run: |
          aws s3 cp bin/ "s3://incloud-cli-releases/inhandnet/incloud-cli/edge/" \
            --recursive --exclude "*" \
            --include "incloud-*" --include "checksums.txt" --include "edge.yaml"
